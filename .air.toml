root = "."
tmp_dir = "tmp"

[build]
pre_cmd = ["mkdir -p internal/api/webdist && touch internal/api/webdist/.gitkeep"]
cmd = "go build -ldflags \"-X github.com/filz0r/jat/internal/version.Version=dev\" -o ./tmp/main ."
entrypoint = ["./tmp/main", "server"]
include_ext = ["go"]
exclude_dir = ["tmp", "web", "docs"]
exclude_regex = ["_test\\.go"]
delay = 200
stop_on_error = true

[log]
time = false

[misc]
clean_on_exit = true