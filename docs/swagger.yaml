basePath: /api
definitions:
  api.apiCountResult:
    properties:
      count:
        type: integer
    required:
    - count
    type: object
  api.apiResponse:
    properties:
      data: {}
      message:
        type: string
      ok:
        type: boolean
    required:
    - message
    - ok
    type: object
  api.applicationRequest:
    properties:
      company_id:
        type: integer
      created_at:
        type: string
      status_id:
        type: integer
      title:
        type: string
      url:
        type: string
    required:
    - company_id
    - created_at
    - status_id
    - title
    - url
    type: object
  api.applicationResponse:
    properties:
      company:
        $ref: '#/definitions/api.companyResponse'
      created_at:
        type: string
      id:
        type: integer
      status:
        $ref: '#/definitions/api.applicationStatusResponse'
      title:
        type: string
      updated_at:
        type: string
      url:
        type: string
      user_id:
        type: string
    required:
    - company
    - created_at
    - id
    - status
    - title
    - updated_at
    - url
    - user_id
    type: object
  api.applicationStatusHistoryResponse:
    properties:
      application_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      new_status:
        $ref: '#/definitions/api.applicationStatusResponse'
      old_status:
        $ref: '#/definitions/api.applicationStatusResponse'
    required:
    - application_id
    - created_at
    - id
    - new_status
    type: object
  api.applicationStatusRequest:
    properties:
      kind:
        type: string
      status:
        type: string
    required:
    - kind
    - status
    type: object
  api.applicationStatusResponse:
    properties:
      archived:
        type: boolean
      created_at:
        type: string
      id:
        type: integer
      kind:
        type: string
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    required:
    - archived
    - created_at
    - id
    - kind
    - status
    - updated_at
    type: object
  api.companyBodyRequest:
    properties:
      name:
        type: string
      website:
        type: string
    required:
    - name
    type: object
  api.companyChangeHistoryResponse:
    properties:
      changed_by:
        $ref: '#/definitions/api.userCreateResponse'
      company_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      new_name:
        type: string
      new_website:
        type: string
      old_name:
        type: string
      old_website:
        type: string
      reverted:
        type: boolean
    required:
    - changed_by
    - company_id
    - created_at
    - id
    - reverted
    type: object
  api.companyResponse:
    properties:
      created_at:
        type: string
      created_by_user:
        $ref: '#/definitions/api.userCreateResponse'
      id:
        type: integer
      name:
        type: string
      total_count:
        type: integer
      updated_at:
        type: string
      updated_by_user:
        $ref: '#/definitions/api.userCreateResponse'
      user_count:
        type: integer
      website:
        type: string
    required:
    - created_at
    - id
    - name
    - updated_at
    type: object
  api.loginResponse:
    properties:
      email:
        type: string
      refresh_token:
        type: string
      token:
        type: string
      user_id:
        type: string
    required:
    - email
    - user_id
    type: object
  api.noteCreateRequest:
    properties:
      body:
        type: string
    required:
    - body
    type: object
  api.noteData:
    properties:
      body:
        type: string
      created_at:
        type: string
      id:
        type: integer
      job_id:
        type: integer
      status:
        $ref: '#/definitions/api.applicationStatusResponse'
      updated_at:
        type: string
      user_id:
        type: string
    required:
    - body
    - created_at
    - id
    - job_id
    - status
    - updated_at
    - user_id
    type: object
  api.systemResponse:
    properties:
      initialized:
        type: boolean
    type: object
  api.userCreateRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  api.userCreateResponse:
    properties:
      created_at:
        type: string
      default_status_id:
        type: integer
      email:
        type: string
      is_admin:
        type: boolean
      updated_at:
        type: string
      user_id:
        type: string
      username:
        type: string
    required:
    - created_at
    - email
    - updated_at
    - user_id
    - username
    type: object
  api.userLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
info:
  contact: {}
  description: 'REST API for the JAT job application tracker. The API requires the
    X-Jat-Client-Type header on all routes (values: web-client, tui-client). Web clients
    use HttpOnly Secure SameSite=Strict cookies; TUI clients receive tokens in the
    JSON response.'
  title: Job Application Tracker (JAT) API
  version: 0.2.0
paths:
  /admin/users/{userID}:
    get:
      consumes:
      - application/json
      description: Admin-only endpoint to grant (GET) or revoke (DELETE) admin privileges
        for a user.
      parameters:
      - description: User UUID
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.apiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.apiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.apiResponse'
      security:
      - BearerAuth: []
      summary: Toggle admin status
      tags:
      - admin
  /application_statuses:
    get:
      consumes:
      - application/json
      description: Returns all application statuses belonging to the authenticated
        user.
      parameters:
      - description: Include archived statuses
        in: query
        name: include_archived
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.applicationStatusResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.apiResponse'
      security:
      - BearerAuth: []
      summary: List current user's application statuses
      tags:
      - application_statuses
    post:
      consumes:
      - application/json
      description: Creates a new application status for the authenticated user.
      parameters:
      - description: Application status payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.applicationStatusRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/api.apiResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.applicationStatusResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
      security:
      - BearerAuth: []
      summary: Create application status
      tags:
      - application_statuses
  /application_statuses/{statusID}:
    delete:
      consumes:
      - application/json
      description: Deletes an application status. If soft_delete=true, performs a
        soft delete (and cascades to linked job applications). Otherwise archives
        the status. Only the owner or an admin can delete it.
      parameters:
      - description: Application status ID
        in: path
        name: statusID
        required: true
        type: integer
      - description: Soft deletes the application status, if set to false it archives
          the status instead
        in: query
        name: soft_delete
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.apiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.apiResponse'
      security:
      - BearerAuth: []
      summary: Delete application status
      tags:
      - application_statuses
    get:
      consumes:
      - application/json
      description: Returns a single application status. Users can read their own;
        admins can read any.
      parameters:
      - description: Application status ID
        in: path
        name: statusID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.applicationStatusResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.apiResponse'
      security:
      - BearerAuth: []
      summary: Get application status
      tags:
      - application_statuses
    put:
      consumes:
      - application/json
      description: Updates an existing application status. Only the owner or an admin
        can update it.
      parameters:
      - description: Application status ID
        in: path
        name: statusID
        required: true
        type: integer
      - description: Updated application status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.applicationStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.applicationStatusResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.apiResponse'
      security:
      - BearerAuth: []
      summary: Update application status
      tags:
      - application_statuses
  /application_statuses/{statusID}/unarchive:
    put:
      consumes:
      - application/json
      description: Restores an archived application status. Only the owner or an admin
        can unarchive it.
      parameters:
      - description: Application status ID
        in: path
        name: statusID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.apiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.apiResponse'
      security:
      - BearerAuth: []
      summary: Unarchive application status
      tags:
      - application_statuses
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Authenticates a user. For web clients the response includes two
        Set-Cookie headers: access_token (HttpOnly; Secure; SameSite=Strict; Path=/api;
        Max-Age=300) and refresh_token (HttpOnly; Secure; SameSite=Strict; Path=/api/auth;
        Max-Age=5184000). TUI clients receive the tokens in the response body. The
        X-Jat-Client-Type header is required by the server middleware but is set automatically
        by the generated web client.'
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.userLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: access_token=<jwt>; HttpOnly; Secure; SameSite=Strict;
                Path=/api; Max-Age=300 AND refresh_token=<token>; HttpOnly; Secure;
                SameSite=Strict; Path=/api/auth; Max-Age=5184000
              type: string
          schema:
            allOf:
            - $ref: '#/definitions/api.apiResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.loginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.apiResponse'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the current refresh token. For web clients the refresh_token
        cookie is cleared by setting Max-Age=-1 on the response. The X-Jat-Client-Type
        header is required by the server middleware but is set automatically by the
        generated web client.
      parameters:
      - description: Bearer refresh token (TUI clients)
        in: header
        name: Authorization
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: refresh_token=; HttpOnly; Secure; SameSite=Strict; Path=/api/auth;
                Max-Age=-1
              type: string
          schema:
            $ref: '#/definitions/api.apiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.apiResponse'
      summary: Logout
      tags:
      - auth
  /auth/refresh_token:
    get:
      consumes:
      - application/json
      description: Issues a new access token from a valid refresh token. Web clients
        get a new access_token cookie (path /api, MaxAge=300); TUI clients get the
        token in the response body. The X-Jat-Client-Type header is required by the
        server middleware but is set automatically by the generated web client.
      parameters:
      - description: Bearer refresh token (TUI clients)
        in: header
        name: Authorization
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Set-Cookie:
              description: access_token=<jwt>; HttpOnly; Secure; SameSite=Strict;
                Path=/api; Max-Age=300
              type: string
          schema:
            allOf:
            - $ref: '#/definitions/api.apiResponse'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.apiResponse'
      summary: Refresh access token
      tags:
      - auth
  /auth/revoke_token:
    get:
      consumes:
      - application/json
      description: Revokes the refresh token passed in the request. For web clients
        the refresh_token cookie is cleared by setting Max-Age=-1 on the response.
        The X-Jat-Client-Type header is required by the server middleware but is set
        automatically by the generated web client.
      parameters:
      - description: Bearer refresh token (TUI clients)
        in: header
        name: Authorization
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: refresh_token=; HttpOnly; Secure; SameSite=Strict; Path=/api/auth;
                Max-Age=-1
              type: string
          schema:
            $ref: '#/definitions/api.apiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.apiResponse'
      summary: Revoke refresh token
      tags:
      - auth
  /company:
    get:
      consumes:
      - application/json
      description: Returns every company in the system. (returns 403 if a non admin
        user passes the preload_users query param)
      parameters:
      - description: Include a count of user applications for this company
        in: query
        name: user_count
        type: boolean
      - description: Include user data for the creation/edits of companies (admin
          only)
        in: query
        name: preload_users
        type: boolean
      - description: Include a count of total applications (global) for this company
        in: query
        name: total_count
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.companyResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.apiResponse'
      security:
      - BearerAuth: []
      summary: List all companies
      tags:
      - companies
    post:
      consumes:
      - application/json
      description: Creates a new company.
      parameters:
      - description: Company payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.companyBodyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/api.apiResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.companyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.apiResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.apiResponse'
      security:
      - BearerAuth: []
      summary: Create company
      tags:
      - companies
  /company/{companyID}:
    delete:
      consumes:
      - application/json
      description: Admin-only. Soft-deletes a company by ID.
      parameters:
      - description: Company ID
        in: path
        name: companyID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.apiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.apiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.apiResponse'
      security:
      - BearerAuth: []
      summary: Delete company
      tags:
      - companies
    get:
      consumes:
      - application/json
      description: Returns a single company by ID.
      parameters:
      - description: Company ID
        in: path
        name: companyID
        required: true
        type: integer
      - description: Include a count of user applications for this company
        in: query
        name: user_count
        type: boolean
      - description: Include a count of total applications (global) for this company
        in: query
        name: total_count
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.companyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.apiResponse'
      security:
      - BearerAuth: []
      summary: Get company
      tags:
      - companies
    put:
      consumes:
      - application/json
      description: Updates an existing company.
      parameters:
      - description: Company ID
        in: path
        name: companyID
        required: true
        type: integer
      - description: Company payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.companyBodyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.companyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.apiResponse'
      security:
      - BearerAuth: []
      summary: Update company
      tags:
      - companies
  /company/{companyID}/count:
    get:
      consumes:
      - application/json
      description: Counts the Job Applications a company has company ID. If the total_count
        query param is true it returns the total applications for a company, otherwise
        it returns the total applications for the user
      parameters:
      - description: Company ID
        in: path
        name: companyID
        required: true
        type: integer
      - description: Include a count of total applications (global) for this company
        in: query
        name: total_count
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.apiCountResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.apiResponse'
      security:
      - BearerAuth: []
      summary: Count Company Job Applications
      tags:
      - companies
  /company/{companyID}/history:
    get:
      consumes:
      - application/json
      description: Returns the history of changes to a company record (admin only)
      parameters:
      - description: Company ID
        in: path
        name: companyID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.companyChangeHistoryResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.apiResponse'
      security:
      - BearerAuth: []
      summary: Get history of changes to a company
      tags:
      - companies
      - admin
  /company/{companyID}/history/{changeID}:
    put:
      consumes:
      - application/json
      description: Reverts a change that was made to a company record (admin only)
      parameters:
      - description: Company ID
        in: path
        name: companyID
        required: true
        type: integer
      - description: Change ID
        in: path
        name: changeID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.apiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.apiResponse'
      security:
      - BearerAuth: []
      summary: Reverts a company change record
      tags:
      - companies
      - admin
  /health:
    get:
      consumes:
      - application/json
      description: Returns a success message if the database is reachable.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiResponse'
            - properties:
                data:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.apiResponse'
      summary: Health check
      tags:
      - system
  /initialized:
    get:
      consumes:
      - application/json
      description: Returns whether the server has been initialized (first admin created).
        This is used by the web UI to decide between the create-account and login
        flows.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.systemResponse'
              type: object
      summary: Check initialization state
      tags:
      - system
  /initialized/set:
